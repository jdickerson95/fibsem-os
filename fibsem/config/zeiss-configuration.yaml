# ZEISS CrossBeam / SmartSEM defaults for fibsem-os
#
# Use this file with setup_session(..., manufacturer="Zeiss", config_path=...)
# and the Zeiss example scripts. It matches SmartSEM pixel-store strings such as
# "1024 * 768" (see ZEISS_RESOLUTIONS / ZEISS_DEFAULT_RESOLUTION in zeiss.py).
#
# For Thermo/Tescan/Demo, keep using microscope-configuration.yaml (or your own YAML).

info:
    name: zeiss-crossbeam-configuration
    ip_address: 127.0.0.1
    manufacturer: Zeiss
stage:
    enabled:                    true
    rotation:                   true
    tilt:                       true
    rotation_reference:         0
    rotation_180:               180
    shuttle_pre_tilt:           35.0
    manipulator_height_limit:   0.0037
electron:
    enabled:                    true
    column_tilt:                0
    eucentric_height:           7.0e-3
    voltage:                    2000
    current:                    50.0e-12
    resolution:                 [1024, 768]
    hfw:                        150.0e-6
    dwell_time:                 1.0e-06
    detector_mode:              SecondaryElectrons
    detector_type:              ETD
ion:
    enabled:                    true
    column_tilt:                52
    eucentric_height:           16.5e-3
    plasma:                     false
    plasma_gas:                 None
    voltage:                    30000
    current:                    2.0e-11
    resolution:                 [1024, 768]
    hfw:                        150.0e-6
    dwell_time:                 1.0e-06
    detector_mode:              SecondaryElectrons
    detector_type:              ETD
manipulator:
    enabled:                    true
    rotation:                   false
    tilt:                       false
gis:
    enabled:                    true
    multichem:                  true
    sputter_coater:             false
imaging:
    beam_type:                  ELECTRON
    resolution:                 [1024, 768]
    hfw:                        150.0e-6
    dwell_time:                 1.0e-06
    imaging_current:            2.0e-11
    autocontrast:               false
    autogamma:                  false
    save:                       false
milling:
    milling_voltage:            30000
    milling_current:            2.0e-09
    dwell_time:                 1.0e-06
    rate:                       3.4e-09
    spot_size:                  5.4e-08
    preset:                     "30 keV; 20 nA"
sim:
    sem: null
    fib: null
    use_cycle: true
